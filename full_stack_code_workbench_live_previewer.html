            js: `// Client-side JS Logic leveraging In-Memory SQLite via SQL.js
let db = null;

// Initialize SQLite Database
async function initDatabase() {
    try {
        console.log("Initializing in-browser SQLite database...");
        const SQL = await initSqlJs({
            locateFile: file => \`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/\${file}\`
        });
        
        db = new SQL.Database();
        
        // Execute initial SQL schema creation
        db.run(\`
            CREATE TABLE IF NOT EXISTS tasks (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                title TEXT NOT NULL,
                category TEXT DEFAULT 'General',
                completed INTEGER DEFAULT 0
            );
        \`);
        
        // Seed default rows
        db.run("INSERT INTO tasks (title, category) VALUES ('Build single-page web app', 'Code');");
        db.run("INSERT INTO tasks (title, category) VALUES ('Test SQLite query runner', 'Work');");

        console.log("SQLite DB Ready!");
        renderTasks();
    } catch (err) {
        console.error("Database initialization failed:", err);
    }
}

// Fetch and render tasks from SQLite DB
function renderTasks() {
    if (!db) return;

    const res = db.exec("SELECT * FROM tasks ORDER BY id DESC;");
    const taskList = document.getElementById('task-list');
    taskList.innerHTML = '';

    let total = 0;
    let completedCount = 0;

    if (res.length > 0) {
        const rows = res[0].values;
        total = rows.length;

        rows.forEach(row => {
            const [id, title, category, completed] = row;
            if (completed) completedCount++;

            const li = document.createElement('li');
            li.className = \`task-item \${completed ? 'completed' : ''}\`;
            li.innerHTML = \`
                <div>
                    <input type="checkbox" \${completed ? 'checked' : ''} onchange="toggleTask(\${id}, \${completed ? 0 : 1})">
                    <span style="margin-left: 8px;">\${title}</span>
                    <span class="badge">\${category}</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(\${id})"><i class="fa-solid fa-trash"></i></button>
            \`;
            taskList.appendChild(li);
        });
    }

    document.getElementById('stat-total').innerText = total;
    document.getElementById('stat-done').innerText = completedCount;
}

// Add task query
document.getElementById('task-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('task-input').value;
    const category = document.getElementById('category-select').value;

    db.run("INSERT INTO tasks (title, category) VALUES (?, ?);", [title, category]);
    document.getElementById('task-input').value = '';
    renderTasks();
});

// Toggle completion status query
window.toggleTask = function(id, newStatus) {
    db.run("UPDATE tasks SET completed = ? WHERE id = ?;", [newStatus, id]);
    renderTasks();
};

// Delete task query
window.deleteTask = function(id) {
    db.run("DELETE FROM tasks WHERE id = ?;", [id]);
    renderTasks();
};

// Custom query tester
document.getElementById('run-sql-btn').addEventListener('click', () => {
    const query = document.getElementById('custom-query').value;
    const outputEl = document.getElementById('sql-output');
    
    try {
        const result = db.exec(query);
        outputEl.textContent = JSON.stringify(result, null, 2);
    } catch (err) {
        outputEl.textContent = "Error: " + err.message;
    }
});

// Run startup
initDatabase();`,

                lineWrapping: true
            };

            editors.html = CodeMirror.fromTextArea(document.getElementById('code-html'), { ...editorConfig, mode: 'htmlmixed' });
            editors.css = CodeMirror.fromTextArea(document.getElementById('code-css'), { ...editorConfig, mode: 'css' });
            editors.js = CodeMirror.fromTextArea(document.getElementById('code-js'), { ...editorConfig, mode: 'javascript' });
            editors.sql = CodeMirror.fromTextArea(document.getElementById('code-sql'), { ...editorConfig, mode: 'sql' });
            editors.node = CodeMirror.fromTextArea(document.getElementById('code-node'), { ...editorConfig, mode: 'javascript' });

            // Load Initial Content
            editors.html.setValue(DEFAULT_CODE.html);
            editors.css.setValue(DEFAULT_CODE.css);
            editors.js.setValue(DEFAULT_CODE.js);
            editors.sql.setValue(DEFAULT_CODE.sql);
            editors.node.setValue(DEFAULT_CODE.node);

            // Add Event Listeners for Cursor tracking & Auto-Compile
            Object.keys(editors).forEach(key => {
                editors[key].on('cursorActivity', () => updateCursorInfo(editors[key]));
                editors[key].on('change', () => {
                    updateCursorInfo(editors[key]);
                    if (document.getElementById('auto-compile').checked) {
                        debounce(buildAndRunApp, 1000)();
                    }
                });
            });

            updateCursorInfo(editors.html);
        }

        // Switch Active Code Tab
        function switchTab(tab) {
            activeTab = tab;
            
            // Update Tab Headers Styling
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'border-cyan-400', 'text-cyan-400', 'bg-slate-800/60');
                btn.classList.add('border-transparent', 'text-slate-400');
            });

            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            activeBtn.classList.add('active', 'border-cyan-400', 'text-cyan-400', 'bg-slate-800/60');
            activeBtn.classList.remove('border-transparent', 'text-slate-400');

            // Hide/Show Editor Pane
            document.querySelectorAll('.editor-pane').forEach(pane => pane.classList.add('hidden'));
            document.getElementById(`editor-container-${tab}`).classList.remove('hidden');

            // Language Indicator
            const langMap = { html: 'HTML5', css: 'CSS3', js: 'JavaScript', sql: 'SQLite', node: 'Node.js Express' };
            document.getElementById('active-lang-indicator').innerText = `${langMap[tab]} Mode`;

            // Refresh CodeMirror Layout
            setTimeout(() => {
                editors[tab].refresh();
                editors[tab].focus();
                updateCursorInfo(editors[tab]);
            }, 50);
        }

        // Update Cursor Status Info in Footer
        function updateCursorInfo(cmInstance) {
            const pos = cmInstance.getCursor();
            const text = cmInstance.getValue();
            document.getElementById('cursor-pos').innerText = `Ln ${pos.line + 1}, Col ${pos.ch + 1}`;
            document.getElementById('doc-size').innerText = `${text.length} chars`;
        }

        // Toggle Split View Layout (Side-by-Side vs Stacked)
        function toggleLayout() {
            const container = document.getElementById('workbench-container');
            const editorPanel = document.getElementById('editor-panel');
            const previewPanel = document.getElementById('preview-panel');
            const icon = document.getElementById('layout-icon');

            isHorizontalLayout = !isHorizontalLayout;

            if (isHorizontalLayout) {
                container.className = "flex-1 flex flex-col md:flex-row overflow-hidden relative";
                editorPanel.className = "w-full md:w-1/2 flex flex-col bg-slate-950 border-r border-slate-800 overflow-hidden";
                previewPanel.className = "w-full md:w-1/2 flex flex-col bg-slate-900 overflow-hidden relative";
                icon.className = "fa-solid fa-columns";
            } else {
                container.className = "flex-1 flex flex-col overflow-hidden relative";
                editorPanel.className = "w-full h-1/2 flex flex-col bg-slate-950 border-b border-slate-800 overflow-hidden";
                previewPanel.className = "w-full h-1/2 flex flex-col bg-slate-900 overflow-hidden relative";
                icon.className = "fa-solid fa-window-maximize";
            }

            // Refresh Active Editor
            editors[activeTab].refresh();
        }

        // Compile & Render Code in iFrame
        function buildAndRunApp() {
            const htmlCode = editors.html.getValue();
            const cssCode = editors.css.getValue();
            const jsCode = editors.js.getValue();

            const previewFrame = document.getElementById('preview-frame');
            const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;

            // Clear Console Logs for New Build
            clearConsole();
            logConsole("Build started... Injecting HTML/CSS/JS and SQLite Engine...", "info");

            // Complete Document Structure with Embedded CDNs (FontAwesome & SQL.js)
            const fullDocument = `
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SQLite WebAssembly Engine CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"><\/script>
    <style>
        ${cssCode}
    </style>
</head>
<body>
    ${htmlCode}

    <script>
        // Intercept Console Logs to Parent Drawer
        (function() {
            const origLog = console.log;
            const origError = console.error;
            const origWarn = console.warn;

            console.log = function(...args) {
                origLog.apply(console, args);
                window.parent.postMessage({ type: 'LOG', text: args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') }, '*');
            };

            console.error = function(...args) {
                origError.apply(console, args);
                window.parent.postMessage({ type: 'ERROR', text: args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') }, '*');
            };

            console.warn = function(...args) {
                origWarn.apply(console, args);
                window.parent.postMessage({ type: 'WARN', text: args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') }, '*');
            };

            window.onerror = function(msg, url, line) {
                window.parent.postMessage({ type: 'ERROR', text: 'Error: ' + msg + ' (Line ' + line + ')' }, '*');
                return false;
            };
        })();
    <\/script>
    <script>
        try {
            ${jsCode}
        } catch (err) {
            console.error(err.message);
        }
    <\/script>
</body>
</html>`;

            iframeDoc.open();
            iframeDoc.write(fullDocument);
            iframeDoc.close();

            showToast("App built & executed successfully!", "success");
        }

        // Listen for console messages from iframe
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type) {
                const { type, text } = event.data;
                logConsole(text, type.toLowerCase());
            }
        });

        // Console Log Display Utility
        let logCounter = 0;
        function logConsole(message, type = 'info') {
            const consoleEl = document.getElementById('console-logs');
            const logItem = document.createElement('div');
            
            let colorClass = 'text-slate-300';
            if (type === 'error') colorClass = 'text-rose-400 font-bold';
            if (type === 'warn') colorClass = 'text-amber-400';
            if (type === 'info') colorClass = 'text-cyan-400';

            const timestamp = new Date().toLocaleTimeString().split(' ')[0];
            logItem.className = `${colorClass} flex items-start gap-2 text-[11px] font-mono leading-relaxed border-b border-slate-900/50 pb-0.5`;
            logItem.innerHTML = `<span class="text-slate-600 shrink-0">[${timestamp}]</span> <span>${escapeHtml(message)}</span>`;

            consoleEl.appendChild(logItem);
            consoleEl.scrollTop = consoleEl.scrollHeight;

            logCounter++;
            document.getElementById('log-count').innerText = `${logCounter} logs`;
        }

        function clearConsole() {
            document.getElementById('console-logs').innerHTML = '';
            logCounter = 0;
            document.getElementById('log-count').innerText = '0 logs';
        }

        function refreshPreview() {
            buildAndRunApp();
        }

        // Bundle and Download Single Standalone HTML File
        function exportSingleFile() {
            const htmlCode = editors.html.getValue();
            const cssCode = editors.css.getValue();
            const jsCode = editors.js.getValue();

            const singleFileContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone Web App</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SQLite WebAssembly Engine CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"><\/script>
    <style>
${cssCode}
    </style>
</head>
<body>
${htmlCode}

    <script>
${jsCode}
    <\/script>
</body>
</html>`;

            const blob = new Blob([singleFileContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'app-single-page.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast("Exported app-single-page.html!", "success");
        }

        // Copy Combined Code to Clipboard
        function copyCombinedCode() {
            const combined = `<!-- HTML -->\n${editors.html.getValue()}\n\n/* CSS */\n${editors.css.getValue()}\n\n// JavaScript\n${editors.js.getValue()}`;
            
            // Clipboard fallback as requested
            const tempInput = document.createElement('textarea');
            tempInput.value = combined;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            showToast("Copied HTML/CSS/JS bundle to clipboard!", "success");
        }

        // Reset to Default Demo Template
        function resetToTemplate() {
            editors.html.setValue(DEFAULT_CODE.html);
            editors.css.setValue(DEFAULT_CODE.css);
            editors.js.setValue(DEFAULT_CODE.js);
            editors.sql.setValue(DEFAULT_CODE.sql);
            editors.node.setValue(DEFAULT_CODE.node);
            buildAndRunApp();
            showToast("Reset to default full-stack sample template", "info");
        }

        // Debounce utility function
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // Helper to Escape HTML in Console
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.innerText = message;
            
            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-cyan-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
            }, 3000);
        }
    </script>
</body>
</html>
